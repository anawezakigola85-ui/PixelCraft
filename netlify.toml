[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing (e.g. /workspace, /account) must serve index.html.
# API traffic goes straight to the backend origin set in VITE_API_BASE_URL,
# so it never depends on this SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
